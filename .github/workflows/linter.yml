name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1
          with:
            fetch-depth: 0
        - name: Set up Go
          uses: actions/setup-go@v7.1.0
          with:
            go-version: stable
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v9.3.0
          with:
            version: v2.15
